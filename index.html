```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizing the Invisible</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 60%,
          rgba(100, 100, 100, 0.28),
          transparent 45%
        ),
        linear-gradient(
          to bottom,
          #050505,
          #141414 55%,
          #030303
        );
    }

    /* =========================
       SMOKE
    ========================= */

    .smoke {
      position: absolute;
      width: 900px;
      height: 900px;

      left: 50%;
      top: 65%;

      transform: translate(-50%, -50%);

      opacity: 0.75;
      filter: blur(25px);

      animation:
        smokeMove 10s ease-in-out infinite alternate;

      pointer-events: none;
    }

    .smoke::before,
    .smoke::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .smoke::before {
      background:
        radial-gradient(
          ellipse at 25% 70%,
          rgba(255,255,255,0.14),
          transparent 32%
        ),
        radial-gradient(
          ellipse at 45% 45%,
          rgba(180,180,180,0.16),
          transparent 35%
        ),
        radial-gradient(
          ellipse at 70% 65%,
          rgba(255,255,255,0.11),
          transparent 30%
        ),
        radial-gradient(
          ellipse at 55% 25%,
          rgba(150,150,150,0.12),
          transparent 35%
        );

      animation:
        smokeDrift 12s ease-in-out infinite alternate;
    }

    .smoke::after {
      background:
        radial-gradient(
          ellipse at 35% 35%,
          rgba(255,255,255,0.08),
          transparent 30%
        ),
        radial-gradient(
          ellipse at 75% 40%,
          rgba(255,255,255,0.10),
          transparent 35%
        ),
        radial-gradient(
          ellipse at 50% 80%,
          rgba(200,200,200,0.12),
          transparent 40%
        );

      filter: blur(45px);

      animation:
        smokeDrift2 15s ease-in-out infinite alternate;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      position: relative;
      z-index: 10;

      width: min(900px, 90%);

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      animation: fadeIn 2s ease forwards;
    }

    .title {
      font-size: clamp(55px, 8vw, 110px);

      font-weight: 400;

      line-height: 0.92;

      letter-spacing: 5px;

      text-transform: uppercase;

      text-shadow:
        0 0 15px rgba(255,255,255,0.12),
        0 0 40px rgba(255,255,255,0.08);

      margin-bottom: 35px;
    }

    .subtitle {
      font-family: Arial, Helvetica, sans-serif;

      font-size: clamp(12px, 1.4vw, 16px);

      letter-spacing: 6px;

      line-height: 1.8;

      color: rgba(255,255,255,0.68);

      margin-bottom: 60px;
    }

    .start-button {
      position: relative;

      background: rgba(255,255,255,0.04);

      color: white;

      border: 1px solid rgba(255,255,255,0.45);

      padding: 20px 48px;

      min-width: 300px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      letter-spacing: 4px;

      cursor: pointer;

      transition:
        background 0.4s ease,
        border-color 0.4s ease,
        transform 0.4s ease,
        box-shadow 0.4s ease;

      backdrop-filter: blur(8px);
    }

    .start-button:hover {
      background: rgba(255,255,255,0.12);

      border-color: rgba(255,255,255,0.85);

      transform: translateY(-3px);

      box-shadow:
        0 0 30px rgba(255,255,255,0.12);
    }

    .start-button:active {
      transform: translateY(0);
    }

    .small-text {
      margin-top: 28px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;

      letter-spacing: 4px;

      color: rgba(255,255,255,0.35);
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes smokeMove {
      from {
        transform:
          translate(-50%, -48%)
          scale(0.95);
      }

      to {
        transform:
          translate(-47%, -58%)
          scale(1.12);
      }
    }

    @keyframes smokeDrift {
      from {
        transform:
          translate(-30px, 20px)
          rotate(-3deg);
      }

      to {
        transform:
          translate(40px, -40px)
          rotate(5deg);
      }
    }

    @keyframes smokeDrift2 {
      from {
        transform:
          translate(30px, 10px)
          scale(0.95);
      }

      to {
        transform:
          translate(-40px, -50px)
          scale(1.12);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .content {
        width: 86%;
      }

      .title {
        letter-spacing: 3px;
      }

      .subtitle {
        letter-spacing: 4px;
        margin-bottom: 50px;
      }

      .start-button {
        width: 85%;
        min-width: unset;
        padding: 20px;
      }

      .smoke {
        width: 650px;
        height: 650px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="smoke"></div>

    <section class="content">

      <h1 class="title">
        VISUALIZING<br>
        THE INVISIBLE
      </h1>

      <p class="subtitle">
        REAL-TIME SMOKE IMPACT<br>
        ON HUMAN LUNGS
      </p>

      <button
        class="start-button"
        onclick="startExperience()">
        BEGIN DISCOVERY PROCESS
      </button>

      <p class="small-text">
        AN INTERACTIVE EXPERIENCE
      </p>

    </section>

  </main>

  <script>
    function startExperience() {
      window.location.href = "survey.html";
    }
  </script>

</body>
</html>
```
