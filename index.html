<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizing the Invisible</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 60%, rgba(80, 80, 80, 0.25), transparent 45%),
        linear-gradient(to bottom, #080808, #181818 55%, #050505);
    }

    /* Smoke */
.smoke {
  position: absolute;
  width: 900px;
  height: 900px;
  left: 50%;
  top: 65%;
  transform: translate(-50%, -50%);
  opacity: 0.75;
  filter: blur(25px);
  animation: smokeMove 10s ease-in-out infinite alternate;
}

.smoke::before,
.smoke::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
}

.smoke::before {
  background:
    radial-gradient(
      ellipse at 25% 70%,
      rgba(255,255,255,0.14),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 45% 45%,
      rgba(180,180,180,0.16),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 70% 65%,
      rgba(255,255,255,0.11),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 55% 25%,
      rgba(150,150,150,0.12),
      transparent 35%
    );
  animation: smokeDrift 12s ease-in-out infinite alternate;
}

.smoke::after {
  background:
    radial-gradient(
      ellipse at 35% 35%,
      rgba(255,255,255,0.08),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 75% 40%,
      rgba(255,255,255,0.10),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 50% 80%,
      rgba(200,200,200,0.12),
      transparent 40%
    );
  filter: blur(45px);
  animation: smokeDrift2 15s ease-in-out infinite alternate;
}

@keyframes smokeMove {
  from {
    transform: translate(-50%, -48%) scale(0.95);
  }

  to {
    transform: translate(-47%, -58%) scale(1.12);
  }
}

@keyframes smokeDrift {
  from {
    transform: translate(-30px, 20px) rotate(-3deg);
  }

  to {
    transform: translate(40px, -40px) rotate(5deg);
  }
}

@keyframes smokeDrift2 {
  from {
    transform: translate(30px, 10px) scale(0.95);
  }

  to {
    transform: translate(-40px, -50px) scale(1.12);
  }
}
    @media (max-width: 600px) {
      .content {
        width: 86%;
      }

      .subtitle {
        margin-bottom: 55px;
      }

      .start-button {
        width: 85%;
        padding: 22px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="smoke"></div>

    <section class="content">

      <h1 class="title">
        VISUALIZING<br>
        THE INVISIBLE
      </h1>

      <p class="subtitle">
        REAL-TIME SMOKE IMPACT<br>
        ON HUMAN LUNGS
      </p>

      <button class="start-button" onclick="startExperience()">
        BEGIN DISCOVERY PROCESS
      </button>

      <p class="small-text">
        AN INTERACTIVE EXPERIENCE
      </p>

    </section>

  </main>

  <script>
    function startExperience() {
      window.location.href = "survey.html";
    }
  </script>

</body>
</html>
